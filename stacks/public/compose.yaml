# public: publish hand-picked web pages / APIs to the internet via Cloudflare Tunnel (see docs/modules/public.md)
#   cloudflared  Tunnel connector: dials out to Cloudflare, so no router port forwarding and the home
#                IP stays hidden
#   hello        Placeholder app (traefik/whoami) to verify the whole path; delete it once you have a
#                real app
#
# Deliberately different from the other stacks:
#   - No ports at all: public traffic only enters via cloudflared, which forwards by service name
#     (http://hello:80); no host port is used
#   - cloudflared only starts when CF_TUNNEL_TOKEN is set in .env (pre-up.sh writes COMPOSE_PROFILES=tunnel)
#   - No docker.sock mount, no extra_hosts
#
# Isolation (tested on OrbStack):
#   Containers on a normal docker network can reach host ports bound to 127.0.0.1 via
#   host.docker.internal (Kuma 3001, Dozzle 8080, ... are all reachable). So "bind to 127.0.0.1" only
#   protects against the LAN, not against containers on the same machine.
#   That is why apps sit on the internal network `public`: no default gateway, no host.docker.internal,
#   no internet. Only cloudflared also joins the `egress` network (it must dial out to Cloudflare).
#   Cost: apps cannot reach the internet themselves. If one really needs to (third-party APIs etc.),
#   add it to `egress` - then, like any normal container, it can reach the host's 127.0.0.1 ports,
#   and if it is compromised those admin UIs are the next hop.
#   Verification commands: docs/modules/public.md, "Isolation self-check".

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: chi-cloudflared
    restart: unless-stopped
    # Not started without a token; pre-up.sh writes COMPOSE_PROFILES to stacks/public/.env based on
    # CF_TUNNEL_TOKEN
    profiles: ["tunnel"]
    # The image entrypoint is already `cloudflared --no-autoupdate` (upgrades happen by pulling a new
    # image: chi update)
    command: ["tunnel", "run"]
    environment:
      # Remotely managed tunnel: routes (which hostname goes to which service) are configured in the
      # Cloudflare dashboard; this machine only needs the token
      TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN:-}"
      # /ready and /metrics listen on the container's loopback only: apps on the same network (which
      # may be compromised) cannot reach /metrics or the debug endpoints
      TUNNEL_METRICS: "127.0.0.1:2000"
      TZ: "${TZ:-UTC}"
    healthcheck:
      # The image is distroless (no shell/curl/wget), so use the exec form of the built-in
      # `cloudflared tunnel ready`: it queries /ready on TUNNEL_METRICS and exits 0 when at least one
      # connection to Cloudflare is up
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - public
      - egress

  hello:
    image: traefik/whoami:latest
    container_name: chi-public-hello
    restart: unless-stopped
    # In the Cloudflare dashboard, set the route's Service to http://hello:80
    networks:
      - public

networks:
  # Network for public apps: internal = no gateway, no internet, no access to the host
  public:
    internal: true
  # Only for cloudflared (and apps that really need the internet)
  egress: {}
