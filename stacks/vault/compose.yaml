# vault: Vaultwarden - a Rust implementation of the Bitwarden server; works with all official Bitwarden
# clients and browser extensions.
# HTTPS is required (browser WebCrypto only works in a secure context), so access it only via `chi serve`.
#
# First run: set VAULTWARDEN_SIGNUPS_ALLOWED=true in .env -> chi up vault -> register -> set it back to
# false -> chi up vault
# Data is encrypted client-side and the server only holds ciphertext, but back it up anyway (chi backup).

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: chi-vaultwarden
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8222:80"
    environment:
      DOMAIN: "https://${TS_FQDN:-localhost}:8005"
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED:-false}"
      # No ADMIN_TOKEN = admin panel disabled. Generate one when needed with
      # `docker exec -it chi-vaultwarden /vaultwarden hash`
      TZ: "${TZ:-UTC}"
    volumes:
      - ${DATA_DIR}/vaultwarden:/data
