# media: small NAS / home theater
#   Jellyfin  Media library + streaming server. Watch with the Jellyfin app on a TV box / iPhone / Mac
#   MeTube    Web UI + API for yt-dlp: paste a link (or chi fetch / an iPhone Shortcut) to download
#             into the library
#
# Layout (MEDIA_DIR, default $DATA_DIR/media):
#   Downloads/  MeTube downloads land here. Over MEDIA_MAX_GB, `chi media clean` deletes oldest first
#   Keep/       Move anything you want to keep forever here; auto-clean never touches it
#   Movies/ TV/ Your own files, also never auto-deleted
# Media files are not in the restic backup (they can be re-downloaded); Jellyfin config and watch
# history are.

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: chi-jellyfin
    restart: unless-stopped
    ports:
      # Open to the LAN by default: a TV box without Tailscale can reach http://<mac-ip>:8096.
      # Jellyfin has its own account login
      - "${MEDIA_BIND_ADDR:-0.0.0.0}:8096:8096"
    environment:
      TZ: "${TZ:-UTC}"
      JELLYFIN_PublishedServerUrl: "https://${TS_FQDN:-localhost}:8009"
    volumes:
      - ${DATA_DIR}/jellyfin/config:/config
      - ${DATA_DIR}/jellyfin/cache:/cache
      # Read-only: Jellyfin cannot delete files; deletion is done by chi media clean or by you
      - ${MEDIA_DIR}:/media:ro

  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: chi-metube
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8081:8081"
    environment:
      DOWNLOAD_DIR: /downloads
      STATE_DIR: /state
      TEMP_DIR: /downloads/.incomplete
      # Jellyfin-friendly naming: channel/date title [id].ext
      OUTPUT_TEMPLATE: "%(uploader|Unknown)s/%(upload_date>%Y-%m-%d|)s %(title).120B [%(id)s].%(ext)s"
      OUTPUT_TEMPLATE_PLAYLIST: "%(playlist_title)s/%(playlist_index|0)03d %(title).120B [%(id)s].%(ext)s"
      OUTPUT_TEMPLATE_CHANNEL: "%(channel|Unknown)s/%(upload_date>%Y-%m-%d|)s %(title).120B [%(id)s].%(ext)s"
      # Written to stacks/media/.env by pre-up.sh: when chi proxy is installed, downloads go through it
      # (for region-locked mainland-China content, e.g. Bilibili)
      YTDL_OPTIONS: "${METUBE_YTDL_OPTIONS:-{}}"
      # Update yt-dlp to nightly every night - YouTube changes often and old versions break fast
      YTDL_NIGHTLY_UPDATE_TIME: "03:30"
      MAX_CONCURRENT_DOWNLOADS: "2"
      DEFAULT_THEME: auto
      TZ: "${TZ:-UTC}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MEDIA_DIR}/Downloads:/downloads
      - ${DATA_DIR}/metube:/state
