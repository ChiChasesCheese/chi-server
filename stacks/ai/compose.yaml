# ai: local LLMs
#   Ollama     Not here! It is installed on the host with brew (chi bootstrap ollama),
#              because Docker on macOS cannot reach the Apple GPU (Metal); in a container models run
#              on the CPU only, several times slower.
#   Open WebUI ChatGPT-style frontend, talks to the host's Ollama.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: chi-open-webui
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3080:8080"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      WEBUI_SECRET_KEY: "${OPEN_WEBUI_SECRET_KEY}"
      WEBUI_URL: "https://${TS_FQDN:-localhost}:8003"
      TZ: "${TZ:-UTC}"
    extra_hosts:
      # OrbStack provides host.docker.internal on its own; Colima needs this line
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_DIR}/open-webui:/app/backend/data
