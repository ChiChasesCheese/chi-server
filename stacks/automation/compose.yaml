# automation: n8n - a self-hosted Zapier. Scheduled jobs, webhooks, API calls, local Ollama, notifications...
# This is the hub: events from other services can be funneled here and dispatched.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: chi-n8n
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5678:5678"
    environment:
      N8N_HOST: "${TS_FQDN:-localhost}"
      N8N_PROTOCOL: https
      # The tailscale serve HTTPS port, see scripts/tailscale-serve.sh
      WEBHOOK_URL: "https://${TS_FQDN:-localhost}:8004/"
      N8N_PROXY_HOPS: "1"
      # Encrypts the credentials stored in the database. Lose it = every saved credential is useless.
      # It lives in .env, so keep a copy of .env somewhere safe
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: "${TZ:-UTC}"
      TZ: "${TZ:-UTC}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_DIR}/n8n:/home/node/.n8n
