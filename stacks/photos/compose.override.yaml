# Minimal changes to Immich's official compose file. The official file is downloaded by fetch.sh
# and not committed.
#
# 1) Bind the port to BIND_ADDR only (upstream uses 0.0.0.0:2283); outside access via `chi serve` (:8006)
#    !override replaces the list instead of appending to it (needs docker compose >= 2.24)
#
# Known limitation: Docker on macOS cannot use the Apple GPU / Neural Engine, so
# immich-machine-learning (face recognition, smart search) runs on the CPU only. The first import of a
# large library is slow; incremental imports afterwards are fine.
services:
  immich-server:
    ports: !override
      - "${BIND_ADDR:-127.0.0.1}:2283:2283"
