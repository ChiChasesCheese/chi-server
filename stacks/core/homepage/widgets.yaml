# https://gethomepage.dev/widgets/
# Note: resources shows the container VM (OrbStack/Colima VM), not the Mac itself.
# For the real host numbers, ssh in and run btop.
- resources:
    label: Container VM
    cpu: true
    memory: true
- datetime:
    text_size: md
    format:
      dateStyle: long
      timeStyle: short
      hour12: false
