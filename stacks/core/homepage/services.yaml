# https://gethomepage.dev/configs/services/
# hrefs use the Tailscale HTTPS ports exposed by `chi serve` (port table in scripts/tailscale-serve.sh).
# Cards for stacks you have not enabled show as not running; that is expected. Delete the entries you
# do not want to see.
- Core:
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://{{HOMEPAGE_VAR_TS_FQDN}}:8001
        description: Monitoring and alerts
        server: local
        container: chi-uptime-kuma
    - China Proxy:
        icon: mdi-earth-arrow-right
        href: https://{{HOMEPAGE_VAR_TS_FQDN}}:8007/ui
        description: mihomo dashboard (chi proxy)
    - Dozzle:
        icon: dozzle.png
        href: https://{{HOMEPAGE_VAR_TS_FQDN}}:8002
        description: Container logs
        server: local
        container: chi-dozzle

- Apps:
    - Open WebUI:
        icon: open-webui.png
        href: https://{{HOMEPAGE_VAR_TS_FQDN}}:8003
        description: Local LLM chat (Ollama)
        server: local
        container: chi-open-webui
    - n8n:
        icon: n8n.png
        href: https://{{HOMEPAGE_VAR_TS_FQDN}}:8004
        description: Workflow automation
        server: local
        container: chi-n8n
    - Vaultwarden:
        icon: vaultwarden.png
        href: https://{{HOMEPAGE_VAR_TS_FQDN}}:8005
        description: Password manager
        server: local
        container: chi-vaultwarden
    - Jellyfin:
        icon: jellyfin.png
        href: https://{{HOMEPAGE_VAR_TS_FQDN}}:8009
        description: Media library (TV / phone / Mac)
        server: local
        container: chi-jellyfin
        widget:
          type: jellyfin
          version: 2   # Jellyfin 10.11+ dropped the /emby prefix and ?api_key=; use the new API
          url: http://host.docker.internal:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
    - MeTube:
        icon: metube.png
        href: https://{{HOMEPAGE_VAR_TS_FQDN}}:8010
        description: Paste a link to download a video
        server: local
        container: chi-metube
    - Onboarding:
        icon: mdi-account-plus
        href: https://{{HOMEPAGE_VAR_TS_FQDN}}:8008
        description: Device setup guide for you and your guests
    - Immich:
        icon: immich.png
        href: https://{{HOMEPAGE_VAR_TS_FQDN}}:8006
        description: Photos
        server: local
        container: immich_server

# public stack: published to the internet via Cloudflare Tunnel (docs/modules/public.md). With PUBLIC_DOMAIN
# empty in .env the link does not work; that is expected
- Public:
    - Hello (example):
        icon: mdi-earth
        href: https://{{HOMEPAGE_VAR_PUBLIC_DOMAIN}}
        description: Public path check (traefik/whoami); replace with your real app
        server: local
        container: chi-public-hello
    - Cloudflare Tunnel:
        icon: cloudflare.png
        href: https://dash.cloudflare.com/?to=/:account/tunnels
        description: Tunnel status; public hostnames are managed in the Cloudflare dashboard
        server: local
        container: chi-cloudflared
