# core: the three things every server should have
#   Homepage     Dashboard / start page, one entry point for every service
#   Uptime Kuma  Monitoring + alerts (push to phone / Telegram / Bark etc. when something is down)
#   Dozzle       Container logs in the browser (read-only)
#
# All ports bind to ${BIND_ADDR} (default 127.0.0.1); outside access goes through `chi serve`.

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: chi-homepage
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      # Homepage 1.x requires an allow-list of Host headers (DNS rebinding protection)
      HOMEPAGE_ALLOWED_HOSTS: "${TS_FQDN:-localhost},localhost:3000,127.0.0.1:3000,${CHI_HOSTNAME:-chi-mini}.local:3000"
      # Referenced in homepage/*.yaml as {{HOMEPAGE_VAR_TS_FQDN}}
      HOMEPAGE_VAR_TS_FQDN: "${TS_FQDN:-localhost}"
      # Library counts / now playing on the Jellyfin card (with JELLYFIN_API_KEY empty the card shows
      # an API error; nothing else is affected)
      HOMEPAGE_VAR_JELLYFIN_KEY: "${JELLYFIN_API_KEY:-}"
      # Domain published by the public stack (Cloudflare Tunnel), used by the "Public" card; empty if public is off
      HOMEPAGE_VAR_PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:-}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ./homepage:/app/config
      # Read-only docker socket, used to show container status on the cards
      - /var/run/docker.sock:/var/run/docker.sock:ro

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: chi-uptime-kuma
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3001:3001"
    environment:
      TZ: "${TZ:-UTC}"
    volumes:
      - ${DATA_DIR}/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dozzle:
    image: amir20/dozzle:latest
    container_name: chi-dozzle
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
